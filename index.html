<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ドットアンドボックス オンライン対戦</title>
<meta name="description" content="Firebase Realtime Databaseで遊ぶ2人対戦のドットアンドボックス">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f1f5f9;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;touch-action:manipulation}button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}.glass{background:rgba(15,23,42,.88);border:1px solid rgba(148,163,184,.18);box-shadow:0 16px 42px rgba(0,0,0,.25)}.hit{stroke:transparent;stroke-width:30;pointer-events:all;cursor:pointer;transition:stroke .12s}.hit:hover{stroke:rgba(251,191,36,.35)}.chip{width:12px;height:12px;border-radius:999px;display:inline-block}.hidden{display:none!important}
</style>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-20 border-b border-slate-700/60 bg-slate-950/90 backdrop-blur px-3 py-3">
  <div class="mx-auto flex max-w-5xl items-center justify-between gap-2">
    <div><div class="text-[11px] font-black tracking-[.2em] text-amber-400">DOTS AND BOXES / ONLINE</div><h1 class="text-lg font-black sm:text-2xl">ドットアンドボックス</h1></div>
    <div class="flex items-center gap-2"><span id="roomBadge" class="hidden rounded-full border border-slate-600 px-3 py-1 text-xs font-bold text-amber-200"></span><button id="shareBtn" class="hidden rounded-lg bg-amber-400 px-3 py-2 text-xs font-black text-slate-950">部屋URLをコピー</button></div>
  </div>
</header>
<div id="toast" class="pointer-events-none fixed left-1/2 top-20 z-50 -translate-x-1/2 rounded-xl border px-4 py-3 text-sm font-bold opacity-0 transition-opacity"></div>
<main class="mx-auto max-w-5xl p-3 sm:p-5">
  <section id="lobby" class="mx-auto mt-6 max-w-lg rounded-3xl p-5 sm:p-8 glass">
    <div class="mb-5 text-center"><div class="mb-2 text-5xl">⬜ ⬛ ⬜</div><h2 class="text-2xl font-black text-amber-300">点と線で陣取り対戦</h2><p class="mt-2 text-sm leading-6 text-slate-300">線を1本ずつ引き、四角（ボックス）の4辺目を引いた人がその土地を獲得。ボックスを取ると追加ターンが続きます。</p></div>
    <label class="mb-1 block text-sm font-bold text-slate-300">あなたの名前</label>
    <input id="nameInput" maxlength="12" class="mb-4 w-full rounded-xl border border-slate-600 bg-slate-950 px-4 py-3 font-bold text-white" placeholder="プレイヤー名">
    <label class="mb-1 block text-sm font-bold text-slate-300">盤面サイズ（部屋作成者のみ選択）</label>
    <select id="sizeSel" class="mb-4 w-full rounded-xl border border-slate-600 bg-slate-950 px-4 py-3 font-bold text-white">
      <option value="3x3">3 × 3（9ボックス・短時間）</option>
      <option value="4x4">4 × 4（16ボックス・標準）</option>
      <option value="5x5" selected>5 × 5（25ボックス・上級）</option>
    </select>
    <div class="grid grid-cols-2 gap-3"><button id="createBtn" class="rounded-xl bg-amber-400 px-4 py-3 font-black text-slate-950 hover:bg-amber-300">部屋を作る（先手）</button><button id="showJoinBtn" class="rounded-xl border border-slate-500 bg-slate-800 px-4 py-3 font-black hover:bg-slate-700">部屋に参加</button></div>
    <div id="joinBox" class="mt-4 hidden"><input id="roomInput" maxlength="6" class="w-full rounded-xl border border-slate-600 bg-slate-950 px-4 py-3 font-bold uppercase" placeholder="部屋ID（例：A1B2C）"><button id="joinBtn" class="mt-2 w-full rounded-xl bg-emerald-500 px-4 py-3 font-black text-slate-950 hover:bg-emerald-400">後手として参加する</button></div>
    <div class="mt-6 rounded-2xl border border-slate-700 bg-slate-950/50 p-4 text-xs leading-6 text-slate-400"><b class="text-slate-200">ルール</b><br>・隣り合う2点の間に横か縦の線を1本だけ引きます（斜めは不可）。<br>・ボックスの4辺目を引いた人がそのボックスを獲得（1個＝1点）。獲得すると追加ターン。<br>・全ての線が引かれた時点で終了し、獲得ボックスが多い方の勝ち。同数は引き分けです。</div>
  </section>

  <section id="game" class="hidden">
    <div class="mb-3 grid gap-3 sm:grid-cols-[1fr_auto]">
      <div class="rounded-2xl p-4 glass"><div class="flex flex-wrap items-center gap-2"><span id="statusText" class="text-lg font-black text-amber-300">対戦準備中</span><span id="turnText" class="rounded-full border border-slate-600 px-3 py-1 text-xs font-bold text-slate-200">—</span><span id="progressText" class="rounded-full border border-slate-600 px-3 py-1 text-xs font-bold text-slate-200">—</span></div><p id="messageText" class="mt-2 text-sm text-slate-300"></p><div id="extraBanner" class="mt-2 hidden rounded-xl border border-amber-400/60 bg-amber-400/15 px-3 py-2 text-sm font-black text-amber-200"></div></div>
      <div class="rounded-2xl p-4 text-right glass"><div class="text-xs text-slate-400">対戦者</div><div id="playersText" class="mt-1 text-sm font-bold"></div><button id="leaveBtn" class="mt-3 rounded-lg border border-slate-600 px-3 py-1.5 text-xs font-bold text-slate-300">ロビーへ戻る</button></div>
    </div>
    <div class="grid gap-3 lg:grid-cols-[minmax(0,1fr)_320px]">
      <div class="space-y-3">
        <div class="rounded-3xl p-3 sm:p-5 glass"><div class="mb-3 flex items-center justify-between"><h2 class="font-black text-slate-200">盤面 <span class="text-xs font-normal text-slate-400">引ける線はホバー/タップで強調</span></h2></div><div id="boardWrap" class="mx-auto w-full max-w-[540px]"></div></div>
        <div class="rounded-2xl p-4 glass"><div class="mb-2 flex items-center justify-between"><h2 class="font-black">行動ログ</h2><span id="turnCounter" class="text-xs text-slate-400"></span></div><div id="logBox" class="max-h-36 space-y-1 overflow-y-auto text-xs text-slate-300"></div></div>
      </div>
      <aside class="space-y-3">
        <div class="rounded-2xl p-4 glass"><div class="mb-3 flex items-center justify-between"><h2 class="font-black text-slate-200">スコア</h2><span class="text-xs text-slate-400">獲得ボックス</span></div><div id="scoreBoard" class="space-y-2"></div></div>
        <div id="waitingPanel" class="rounded-2xl p-4 glass"><h2 class="font-black text-amber-300">対戦準備</h2><p id="waitingText" class="mt-2 text-sm leading-6 text-slate-300"></p><button id="startBtn" class="mt-4 hidden w-full rounded-xl bg-amber-400 px-4 py-3 font-black text-slate-950">対局開始</button></div>
      </aside>
    </div>
  </section>
</main>
<div id="resultModal" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/85 p-4"><div class="w-full max-w-sm rounded-3xl border border-amber-400/60 p-6 text-center glass"><div id="resultEmoji" class="text-6xl">🏆</div><h2 id="resultTitle" class="mt-3 text-3xl font-black text-amber-300"></h2><div id="resultScores" class="mt-3 space-y-1 text-sm font-bold text-slate-200"></div><p id="resultReason" class="mt-3 text-sm leading-6 text-slate-300"></p><button id="replayBtn" class="mt-6 hidden w-full rounded-xl bg-amber-400 px-4 py-3 font-black text-slate-950">再戦する</button><button id="resultBackBtn" class="mt-3 w-full rounded-xl border border-slate-600 px-4 py-3 font-bold">ロビーへ戻る</button></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDTH8N9_9QAj_Id9KNnvVfN62v42zg-Rtk",authDomain:"hiragajan-af30f.firebaseapp.com",databaseURL:"https://hiragajan-af30f-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"hiragajan-af30f",storageBucket:"hiragajan-af30f.firebasestorage.app",messagingSenderId:"209578576362",appId:"1:209578576362:web:1875a3f7ce9ff21c93ca93"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const DB_ROOT="dab_rooms";
const P_COLORS=["#fb7185","#38bdf8"];const P_DEEP=["#e11d48","#0284c7"];const P_ROLE=["先手","後手"];
let token=localStorage.getItem("dab_token")||("u_"+Math.random().toString(36).slice(2,10));localStorage.setItem("dab_token",token);
let playerName=localStorage.getItem("dab_name")||("プレイヤー"+Math.floor(100+Math.random()*900));
let roomId=null,roomRef=null,roomListener=null,roomState=null;
const $=id=>document.getElementById(id);
const lobby=$("lobby"),game=$("game"),toast=$("toast"),nameInput=$("nameInput"),roomInput=$("roomInput"),sizeSel=$("sizeSel");nameInput.value=playerName;
function notify(text,error){toast.textContent=text;toast.className="pointer-events-none fixed left-1/2 top-20 z-50 -translate-x-1/2 rounded-xl border px-4 py-3 text-sm font-bold transition-opacity "+(error?"border-rose-400 bg-rose-700 text-white":"border-amber-300 bg-amber-400 text-slate-950");toast.style.opacity="1";clearTimeout(notify.t);notify.t=setTimeout(()=>{toast.style.opacity="0"},3200)}
function esc(s){return String(s==null?"":s).split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;").split(String.fromCharCode(34)).join("&quot;")}
function normalizeSize(raw){if(!raw)return{rows:5,cols:5};const rows=Math.min(6,Math.max(3,parseInt(raw.rows,10)||5));const cols=Math.min(6,Math.max(3,parseInt(raw.cols,10)||5));return{rows:rows,cols:cols}}
function normalizeMap(raw){const m=new Map();if(raw){for(const k in raw){if(raw[k])m.set(k,raw[k])}}return m}
function hKey(r,c){return "h"+r+"_"+c}function vKey(r,c){return "v"+r+"_"+c}
function boxComplete(h,v,r,c){return h.has(hKey(r,c))&&h.has(hKey(r+1,c))&&v.has(vKey(r,c))&&v.has(vKey(r,c+1))}
function totalEdges(size){return (size.rows+1)*size.cols+size.rows*(size.cols+1)}
function roomPlayers(state){if(!state||!state.players)return[];return Object.values(state.players).filter(p=>p&&p.token)}
function sortedPlayers(state){return roomPlayers(state).sort((a,b)=>(a.index==null?0:a.index)-(b.index==null?0:b.index))}
function nameOf(state,tok){const p=sortedPlayers(state).find(x=>x.token===tok);return p&&p.name?p.name:"プレイヤー"}
function colorOf(state,tok){const ps=sortedPlayers(state);const i=ps.findIndex(p=>p.token===tok);return P_COLORS[(i<0?0:i)%2]}
function deepOf(state,tok){const ps=sortedPlayers(state);const i=ps.findIndex(p=>p.token===tok);return P_DEEP[(i<0?0:i)%2]}
function roleOf(state,tok){const ps=sortedPlayers(state);const i=ps.findIndex(p=>p.token===tok);return P_ROLE[(i<0?0:i)%2]}
function symbolOf(state,tok){const p=sortedPlayers(state).find(x=>x.token===tok);if(!p)return "●";const n=String(p.name||"").trim();return n?n.slice(0,1):"●"}
function scoresOf(state){const m={};sortedPlayers(state).forEach(p=>{m[p.token]=0});normalizeMap(state.boxes).forEach(tok=>{m[tok]=(m[tok]||0)+1});return m}
function appendLog(state,text){if(!Array.isArray(state.logs))state.logs=[];state.logs.push(text);if(state.logs.length>40)state.logs=state.logs.slice(-40)}
function roomPath(id){return DB_ROOT+"/"+id}
function makeRoom(id,size){const r={roomId:id,hostToken:token,status:"waiting",round:1,size:{rows:size.rows,cols:size.cols},players:{},hedges:{},vedges:{},boxes:{},logs:[playerName+" が部屋を作成しました（" + size.rows + "×" + size.cols + "）。相手の参加を待っています。"],createdAt:Date.now()};r.players[token]={token:token,name:playerName,index:0};return r}
async function createRoom(){playerName=(nameInput.value.trim()||"名無し").slice(0,12);localStorage.setItem("dab_name",playerName);const pv=sizeSel.value.split("x");const size=normalizeSize({rows:parseInt(pv[0],10),cols:parseInt(pv[1],10)});for(let i=0;i<5;i++){const id=Math.random().toString(36).slice(2,7).toUpperCase();const ref=db.ref(roomPath(id));try{const snap=await ref.once("value");if(!snap.exists()){await ref.update(makeRoom(id,size));connectRoom(id);notify("部屋を作成しました");return}}catch(e){notify("作成エラー: "+e.message,true);return}}notify("部屋番号の発行に失敗しました",true)}
async function joinRoom(){playerName=(nameInput.value.trim()||"名無し").slice(0,12);localStorage.setItem("dab_name",playerName);const id=roomInput.value.trim().toUpperCase();if(!id)return notify("部屋IDを入力してください",true);const ref=db.ref(roomPath(id));try{const snap=await ref.once("value");const state=snap.val();if(!state)return notify("その部屋は見つかりません",true);if(state.players&&state.players[token])return connectRoom(id);const list=roomPlayers(state);if(state.status!=="waiting"||list.length>=2)return notify("参加できません（対局中または満員です）",true);const updates={};updates["players/"+token]={token:token,name:playerName,index:list.length};updates.logs=(state.logs||[]).concat([playerName+" が参加しました。"]);await ref.update(updates);connectRoom(id);notify("部屋に参加しました")}catch(e){notify("参加エラー: "+e.message,true)}}
function detach(){if(roomRef&&roomListener){roomRef.off("value",roomListener)}roomListener=null}
function connectRoom(id){detach();roomId=id;localStorage.setItem("dab_room",id);const url=new URL(location.href);url.searchParams.set("room",id);history.replaceState({},"",url);roomRef=db.ref(roomPath(id));roomListener=function(snap){roomState=snap.val();if(!roomState){notify("部屋が削除されました",true);goLobby();return}render(roomState)};roomRef.on("value",roomListener,function(e){notify("接続エラー: "+e.message,true)});lobby.classList.add("hidden");game.classList.remove("hidden");$("roomBadge").textContent="部屋 "+id;$("roomBadge").classList.remove("hidden");$("shareBtn").classList.remove("hidden")}
function goLobby(){detach();roomRef=null;roomId=null;roomState=null;localStorage.removeItem("dab_room");const url=new URL(location.href);url.searchParams.delete("room");history.replaceState({},"",url);lobby.classList.remove("hidden");game.classList.add("hidden");$("roomBadge").classList.add("hidden");$("shareBtn").classList.add("hidden");$("resultModal").classList.add("hidden")}
function applyMove(room,tok,type,r,c){if(!room||room.status!=="playing")return{ok:false};if(room.turn!==tok)return{ok:false};const size=normalizeSize(room.size);const isH=type==="h";if(isH){if(!(r>=0&&r<=size.rows&&c>=0&&c<size.cols))return{ok:false}}else{if(!(r>=0&&r<size.rows&&c>=0&&c<=size.cols))return{ok:false}}const h=normalizeMap(room.hedges),v=normalizeMap(room.vedges),key=isH?hKey(r,c):vKey(r,c);if((isH?h:v).has(key))return{ok:false};if(isH){if(!room.hedges)room.hedges={};room.hedges[key]=tok;h.set(key,tok)}else{if(!room.vedges)room.vedges={};room.vedges[key]=tok;v.set(key,tok)}if(!room.boxes)room.boxes={};const cands=isH?[[r-1,c],[r,c]]:[[r,c-1],[r,c]];let gained=0;cands.forEach(function(pair){const br=pair[0],bc=pair[1];if(br<0||br>=size.rows||bc<0||bc>=size.cols)return;const bk=br+"_"+bc;if(room.boxes[bk])return;if(boxComplete(h,v,br,bc)){room.boxes[bk]=tok;gained++}});room.lastEdge=key;const nm=nameOf(room,tok);appendLog(room,nm+" が"+(isH?"横":"縦")+"線を引きました"+(gained>0?"（"+gained+"ボックス獲得・追加ターン）":"")+"。");const total=totalEdges(size),drawn=h.size+v.size;if(drawn>=total){const sc={};const ps=sortedPlayers(room);ps.forEach(function(p){sc[p.token]=0});normalizeMap(room.boxes).forEach(function(t){sc[t]=(sc[t]||0)+1});const a=sc[ps[0].token]||0,b=ps[1]?(sc[ps[1].token]||0):0;room.status="finished";room.lastGain=null;if(a>b){room.winner=ps[0].token;room.resultReason="獲得ボックス "+a+" 対 "+b+" で "+nameOf(room,ps[0].token)+" の勝利です。"}else if(b>a){room.winner=ps[1].token;room.resultReason="獲得ボックス "+b+" 対 "+a+" で "+nameOf(room,ps[1].token)+" の勝利です。"}else{room.winner=null;room.resultReason="獲得ボックス "+a+" 対 "+b+" の引き分けです。"}appendLog(room,"対局終了。"+room.resultReason);return{ok:true}}room.lastGain={token:tok,gained:gained};if(gained===0){const ps=sortedPlayers(room);const i=ps.findIndex(function(p){return p.token===tok});room.turn=ps[(i+1)%ps.length].token}return{ok:true}}
function playEdge(type,r,c){if(!roomRef||!roomState)return;roomRef.transaction(function(s){if(!s)return s;const res=applyMove(s,token,type,r,c);if(!res||!res.ok)return;return s},function(err){if(err)notify("操作エラー: "+err.message,true)})}
function startGame(){if(!roomRef)return;roomRef.transaction(function(s){if(!s||s.status!=="waiting"||s.hostToken!==token)return s;const ps=sortedPlayers(s);if(ps.length!==2)return s;s.status="playing";s.turn=ps[((s.round||1)-1)%2].token;s.winner=null;s.resultReason=null;s.lastEdge=null;s.lastGain=null;appendLog(s,"対局開始！先手は "+nameOf(s,s.turn)+" です。");return s},function(err){if(err)notify("開始エラー: "+err.message,true)})}
function replay(){if(!roomRef)return;detach();roomRef=db.ref(roomPath(roomId));const ps=sortedPlayers(roomState);const nr=(roomState&&roomState.round?roomState.round:1)+1;const starter=ps[((nr-1)%ps.length+ps.length)%ps.length];roomRef.update({status:"playing",round:nr,turn:starter.token,hedges:null,vedges:null,boxes:null,lastEdge:null,lastGain:null,winner:null,resultReason:null,logs:["再戦を開始しました。先手は "+starter.name+" です。"]}).then(function(){connectRoom(roomId);$("resultModal").classList.add("hidden")}).catch(function(e){notify("再戦エラー: "+e.message,true)})}
function render(state){if(!state)return;const ps=sortedPlayers(state),size=normalizeSize(state.size),turnTok=state.turn;const myTurn=state.status==="playing"&&turnTok===token;$("statusText").textContent=state.status==="waiting"?"対戦準備中":state.status==="finished"?"対局終了":"対局中";$("turnText").textContent=state.status==="playing"?("手番："+nameOf(state,turnTok)):"—";$("turnText").style.borderColor=state.status==="playing"?colorOf(state,turnTok):"#475569";$("turnText").style.color=state.status==="playing"?colorOf(state,turnTok):"#cbd5e1";const h=normalizeMap(state.hedges),v=normalizeMap(state.vedges);$("progressText").textContent="線 "+(h.size+v.size)+" / "+totalEdges(size);$("messageText").textContent=state.status==="waiting"?(ps.length<2?"相手の参加を待っています。部屋URLを送ってください。":"2人そろいました。ホストが対局開始を押してください。"):state.status==="finished"?(state.resultReason||""):(myTurn?"あなたの手番です。点と点の間をタップして線を1本引いてください。":nameOf(state,turnTok)+" の手番です。");$("playersText").innerHTML=ps.map(function(p){return '<div style="color:'+colorOf(state,p.token)+'">'+esc(p.name)+' <span class="text-xs text-slate-400">('+roleOf(state,p.token)+')</span></div>'}).join("");const sc=scoresOf(state);$("scoreBoard").innerHTML=ps.map(function(p){return '<div class="flex items-center justify-between rounded-xl border border-slate-700 bg-slate-950/60 px-3 py-2 '+(state.status==="playing"&&turnTok===p.token?"ring-2 ring-amber-400":'')+'"><span class="flex items-center gap-2 text-sm font-bold"><span class="chip" style="background:'+colorOf(state,p.token)+'"></span>'+esc(p.name)+'</span><span class="text-lg font-black" style="color:'+colorOf(state,p.token)+'">'+(sc[p.token]||0)+'</span></div>'}).join("");if(state.lastGain&&state.lastGain.gained>0&&state.status==="playing"){$("extraBanner").textContent=nameOf(state,state.lastGain.token)+" が "+state.lastGain.gained+" ボックス獲得！続けて線を引けます（追加ターン）";$("extraBanner").classList.remove("hidden")}else{$("extraBanner").classList.add("hidden")}buildBoard(state,ps,size,h,v,myTurn);$("logBox").innerHTML=(state.logs||[]).slice().reverse().map(function(x){return '<div class="border-l-2 border-amber-500 pl-2">'+esc(x)+'</div>'}).join("");const wait=state.status==="waiting";$("waitingPanel").classList.toggle("hidden",!wait);$("waitingText").textContent=ps.length<2?"現在1人です。もう1人が参加すると開始できます。":"2人そろいました。ホストが対局を開始してください。";$("startBtn").classList.toggle("hidden",!(wait&&state.hostToken===token));$("startBtn").disabled=ps.length!==2;$("turnCounter").textContent=state.status==="playing"?(state.round>1?"第"+state.round+"局":"第1局"):"";if(state.status==="finished")showResult(state,ps,sc);else $("resultModal").classList.add("hidden")}
function buildBoard(state,ps,size,h,v,myTurn){const rows=size.rows,cols=size.cols,cell=62,pad=22,W=cols*cell+pad*2,H=rows*cell+pad*2;let out='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">';out+='<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="20" fill="#0e1729"/>';let r,c;for(r=0;r<rows;r++){for(c=0;c<cols;c++){const x=pad+c*cell,y=pad+r*cell,owner=normalizeMap(state.boxes).get(r+"_"+c);if(owner){const col=colorOf(state,owner);out+='<rect x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+'" rx="4" fill="'+col+'" opacity="0.26"/>';out+='<text x="'+(x+cell/2)+'" y="'+(y+cell/2)+'" text-anchor="middle" dominant-baseline="central" font-size="'+(cell*0.34)+'" font-weight="900" fill="'+col+'">'+esc(symbolOf(state,owner))+'</text>'}}}if(myTurn){for(r=0;r<=rows;r++){for(c=0;c<cols;c++){if(h.has(hKey(r,c)))continue;out+='<line x1="'+(pad+c*cell)+'" y1="'+(pad+r*cell)+'" x2="'+(pad+(c+1)*cell)+'" y2="'+(pad+r*cell)+'" stroke="#ffffff" stroke-opacity="0.13" stroke-width="5" stroke-linecap="round"/>'}}for(r=0;r<rows;r++){for(c=0;c<=cols;c++){if(v.has(vKey(r,c)))continue;out+='<line x1="'+(pad+c*cell)+'" y1="'+(pad+r*cell)+'" x2="'+(pad+c*cell)+'" y2="'+(pad+(r+1)*cell)+'" stroke="#ffffff" stroke-opacity="0.13" stroke-width="5" stroke-linecap="round"/>'}}}h.forEach(function(tok,key){const q=key.slice(1).split("_"),rr=parseInt(q[0],10),cc=parseInt(q[1],10),col=colorOf(state,tok);const x1=pad+cc*cell,y1=pad+rr*cell,x2=pad+(cc+1)*cell,y2=y1;if(state.lastEdge===key){out+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" opacity="0.35"/>'}out+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="7" stroke-linecap="round"/>'});v.forEach(function(tok,key){const q=key.slice(1).split("_"),rr=parseInt(q[0],10),cc=parseInt(q[1],10),col=colorOf(state,tok);const x1=pad+cc*cell,y1=pad+rr*cell,x2=x1,y2=pad+(rr+1)*cell;if(state.lastEdge===key){out+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" opacity="0.35"/>'}out+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="7" stroke-linecap="round"/>'});for(r=0;r<=rows;r++){for(c=0;c<=cols;c++){out+='<circle cx="'+(pad+c*cell)+'" cy="'+(pad+r*cell)+'" r="5.5" fill="#cbd5e1"/>'}}if(myTurn&&state.status==="playing"){for(r=0;r<=rows;r++){for(c=0;c<cols;c++){if(h.has(hKey(r,c)))continue;out+='<line class="hit" data-t="h" data-r="'+r+'" data-c="'+c+'" x1="'+(pad+c*cell)+'" y1="'+(pad+r*cell)+'" x2="'+(pad+(c+1)*cell)+'" y2="'+(pad+r*cell)+'"/>'}}for(r=0;r<rows;r++){for(c=0;c<=cols;c++){if(v.has(vKey(r,c)))continue;out+='<line class="hit" data-t="v" data-r="'+r+'" data-c="'+c+'" x1="'+(pad+c*cell)+'" y1="'+(pad+r*cell)+'" x2="'+x2v(pad,c,cell)+'" y2="'+(pad+(r+1)*cell)+'"/>'}}}out+='</svg>';const wrap=$("boardWrap");wrap.innerHTML=out;const svg=wrap.querySelector("svg");svg.querySelectorAll(".hit").forEach(function(el){el.addEventListener("click",function(){playEdge(el.getAttribute("data-t"),parseInt(el.getAttribute("data-r"),10),parseInt(el.getAttribute("data-c"),10))})})}
function x2v(pad,c,cell){return pad+c*cell}
function showResult(state,ps,sc){const modal=$("resultModal");modal.classList.remove("hidden");modal.classList.add("flex");const draw=!state.winner;$("resultEmoji").textContent=draw?"🤝":"🏆";$("resultTitle").textContent=draw?"引き分け":(nameOf(state,state.winner)+" の勝利！");$("resultScores").innerHTML=ps.map(function(p){return '<div class="flex items-center justify-between rounded-lg bg-slate-950/60 px-3 py-1.5"><span class="flex items-center gap-2"><span class="chip" style="background:'+colorOf(state,p.token)+'"></span>'+esc(p.name)+'</span><span class="font-black" style="color:'+colorOf(state,p.token)+'">'+(sc[p.token]||0)+' ボックス</span></div>'}).join("");$("resultReason").textContent=state.resultReason||"対局が終了しました。";$("replayBtn").classList.toggle("hidden",state.hostToken!==token)}
$("createBtn").onclick=createRoom;$("showJoinBtn").onclick=function(){$("joinBox").classList.toggle("hidden")};$("joinBtn").onclick=joinRoom;$("startBtn").onclick=startGame;$("replayBtn").onclick=replay;$("leaveBtn").onclick=function(){if(confirm("ロビーへ戻りますか？"))goLobby()};$("resultBackBtn").onclick=goLobby;$("shareBtn").onclick=function(){const u=new URL(location.href);u.searchParams.set("room",roomId);const href=u.href;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(href).then(function(){notify("部屋URLをコピーしました")}).catch(function(){prompt("このURLをコピーしてください",href)})}else{prompt("このURLをコピーしてください",href)}};
window.addEventListener("DOMContentLoaded",function(){const q=new URLSearchParams(location.search).get("room")||localStorage.getItem("dab_room");if(q){roomInput.value=q;joinRoom()}});window.addEventListener("beforeunload",detach);
</script>
